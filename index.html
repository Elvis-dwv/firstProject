<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music Style Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div class="player-card">
      <div class="player-grid">
        <div class="player-main">
          <div class="cover-art">
            <img id="cover-image" src="jpg/rema.jpg" alt="Album cover">
          </div>
          <div class="track-details">
            <span class="track-label">Now Playing</span>
            <h1 id="track-title">Loading...</h1>
            <p id="track-artist">Artist</p>
          </div>

          <div class="option-row">
            <button id="shuffle-btn" class="option-btn" aria-label="Shuffle">🔀</button>
            <span class="option-note">Music player</span>
            <button id="repeat-btn" class="option-btn" aria-label="Repeat">🔁</button>
          </div>

          <div class="progress-row">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" min="0" max="100" value="0">
            <span id="total-duration">0:00</span>
          </div>

          <div class="control-row">
            <button id="prev-btn" class="control-btn" aria-label="Previous">⏮</button>
            <button id="play-pause-btn" class="play-btn" aria-label="Play/Pause">▶ </button>
            <button id="next-btn" class="control-btn" aria-label="Next">⏭</button>
          </div>

          <div class="volume-row">
            <span class="volume-label">🔊</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
          </div>
        </div>

        <div class="playlist-container">
          <div class="playlist-header">
            <h2>Up Next</h2>
          </div>
          <ul id="playlist-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
